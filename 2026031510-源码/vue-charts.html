<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可视化分析 | 数据驱动的教育决策多维动态洞察系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      height: 72px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #1e1b4b;
      letter-spacing: 0.5px;
    }
    .logo span {
      color: #7c3aed;
    }
    .nav {
      display: flex;
      gap: 42px;
      align-items: center;
    }
    .nav-item {
      font-size: 15px;
      color: #374151;
      font-weight: 500;
      cursor: pointer;
      transition: 0.35s;
      position: relative;
      padding: 6px 0;
      text-decoration: none;
    }
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: #7c3aed;
      transform: translateX(-50%);
      border-radius: 3px;
      transition: 0.35s;
    }
    .nav-item:hover {
      color: #7c3aed;
      transform: translateY(-1px);
    }
    .nav-item:hover::after {
      width: 110%;
    }
    .nav-item.active {
      color: #7c3aed;
    }
    .nav-item.active::after {
      width: 110%;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: #f3f4f6;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
    }
    .back-btn:hover {
      background: #e5e7eb;
      color: #7c3aed;
    }

    .news-bar {
      margin-top: 72px;
      width: 100%;
      height: 44px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
      box-shadow: 0 4px 20px rgba(124,58,237,0.1);
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 60px 7%;
    }

    .chart-area {
      width: 100%;
      height: calc(100vh - 72px - 44px - 120px);
      min-height: 800px;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
    }

    .chart-area iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer {
      background: #111827;
      padding: 50px 7%;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    .footer a {
      color: #9ca3af;
      font-size: 14px;
      text-decoration: none;
      transition: 0.3s;
      position: relative;
    }
    .footer a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: 0.3s;
    }
    .footer a:hover {
      color: #fff;
    }
    .footer a:hover::after {
      width: 100%;
    }
    .footer-line {
      height: 8px;
      background: linear-gradient(90deg, #7c3aed, #ec4899, #fb923c, #ffd166);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(60px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 顶部进度条 */
    #top-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
      z-index: 9999;
      transition: width 0.3s ease, opacity 0.4s ease;
      box-shadow: 0 0 8px rgba(124,58,237,0.6);
    }

    /* iframe 遮罩层 */
    #iframe-loader {
      position: absolute;
      inset: 0;
      background: #f8f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      border-radius: 24px;
      transition: opacity 0.5s ease;
    }
    #iframe-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-icon {
      width: 56px;
      height: 56px;
      border: 4px solid #e5e7eb;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 15px;
      color: #6b7280;
      font-weight: 500;
    }
    .loader-bar-wrap {
      width: 200px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .loader-percent {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div id="top-progress"></div>

<div class="header">
  <div class="logo">数据洞察 <span>平台</span></div>
  <div class="nav">
    <a href="vue-charts.html" class="nav-item active">可视化分析</a>
    <a href="data-self.html" class="nav-item">自助数据</a>
    <a href="ai.html" class="nav-item">小助理</a>
    <a href="index.html" class="back-btn">← 返回主页</a>
  </div>
</div>

<div class="news-bar"></div>

<div class="container">
  <div id="chart" class="chart-area">
    <div id="iframe-loader">
      <div class="loader-icon"></div>
      <div class="loader-text">正在加载教育数据看板…</div>
      <div class="loader-bar-wrap">
        <div class="loader-bar-fill" id="loader-bar-fill"></div>
      </div>
      <div class="loader-percent" id="loader-percent">0%</div>
    </div>
    <iframe id="dashboard-frame" src="education_dashboard.html" title="教育数据综合交互看板"></iframe>
  </div>
</div>

<div class="footer">
  <a href="#">隐私政策</a>
  <a href="#">服务条款</a>
  <a href="#">联系我们</a>
</div>
<div class="footer-line"></div>

<script>
  const topBar      = document.getElementById('top-progress');
  const loaderOverlay = document.getElementById('iframe-loader');
  const barFill     = document.getElementById('loader-bar-fill');
  const percent     = document.getElementById('loader-percent');
  const frame       = document.getElementById('dashboard-frame');

  let current = 0;
  let timer   = null;

  // 模拟进度：前 80% 用递减速度推进，剩余等 load 事件
  function advance() {
    if (current >= 80) { clearInterval(timer); return; }
    // 越接近 80 增量越小
    const step = Math.max(0.3, (80 - current) * 0.04);
    current = Math.min(80, current + step);
    setProgress(current);
  }

  function setProgress(val) {
    topBar.style.width   = val + '%';
    barFill.style.width  = val + '%';
    percent.textContent  = Math.floor(val) + '%';
  }

  function finish() {
    clearInterval(timer);
    current = 100;
    setProgress(100);
    // 顶部条淡出
    setTimeout(() => { topBar.style.opacity = '0'; }, 300);
    setTimeout(() => { topBar.style.width = '0%'; topBar.style.opacity = '1'; }, 700);
    // 遮罩淡出
    loaderOverlay.classList.add('hidden');
    setTimeout(() => { loaderOverlay.style.display = 'none'; }, 500);
  }

  timer = setInterval(advance, 200);
  frame.addEventListener('load', finish);
</script>
</body>
</html>
