<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读素养视域下的教育决策多维动态洞察系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      height: 72px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #1e1b4b;
      letter-spacing: 0.5px;
    }
    .logo span {
      color: #7c3aed;
    }
    .nav {
      display: flex;
      gap: 42px;
    }
    .nav-item {
      font-size: 15px;
      color: #374151;
      font-weight: 500;
      cursor: pointer;
      transition: 0.35s;
      position: relative;
      padding: 6px 0;
      text-decoration: none;
    }
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: #7c3aed;
      transform: translateX(-50%);
      border-radius: 3px;
      transition: 0.35s;
    }
    .nav-item:hover {
      color: #7c3aed;
      transform: translateY(-1px);
    }
    .nav-item:hover::after {
      width: 110%;
    }

    .news-bar {
      margin-top: 72px;
      width: 100%;
      height: 44px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
      box-shadow: 0 4px 20px rgba(124,58,237,0.1);
    }

    .hero {
      padding: 140px 8% 120px;
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      background: #ffffff;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      right: -200px;
      top: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(124, 58, 237, 0.035) 0%, transparent 60%);
      z-index: 0;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      left: -120px;
      bottom: -200px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.028) 0%, transparent 65%);
      z-index: 0;
    }

    .hero-text {
      flex: 1;
      max-width: 900px;
      position: relative;
      z-index: 2;
    }
    
    .hero-title {
      font-size: 46px;
      font-weight: 700;
      color: #1f2937;
      line-height: 1.1;
      margin-bottom: 12px;
      opacity: 0;
      animation: titleSlide 1s 0.1s forwards;
    }
    .hero-gradient {
      font-size: 64px;
      font-weight: 850;
      color: #7c3aed;
      line-height: 1.1;
      margin-bottom: 12px;
      opacity: 0;
      animation: titleSlide 1s 0.3s forwards;
    }
    .hero-gradient-last {
      font-size: 72px;
      font-weight: 850;
      color: #7c3aed;
      display: flex;
      align-items: center;
      gap: 18px;
      line-height: 1.05;
      opacity: 0;
      animation: titleSlide 1s 0.5s forwards;
    }
    
    .hero-dot {
      width: 58px;
      height: 58px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
    }

    .edu-info {
      width: 380px;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 32px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      opacity: 0;
      animation: fadeUp 1s 0.8s forwards;
      z-index: 2;
      position: relative;
    }
    .edu-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .edu-title::before {
      content: '';
      width: 6px;
      height: 24px;
      background: #7c3aed;
      border-radius: 3px;
    }

    .btn {
      margin-top: 50px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 20px 48px;
      background: #ffffff;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      cursor: pointer;
      transition: 0.4s;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237,0.15);
      position: relative;
      opacity: 0;
      animation: titleSlide 1s 0.7s forwards;
    }
    .btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(124, 58, 237, 0.18);
      color: #7c3aed;
      border-color: rgba(124, 58, 237,0.3);
    }
    .btn-icon {
      width: 18px;
      height: 18px;
      border: 1.8px solid #7c3aed;
      border-radius: 4px;
      transition: 0.3s;
    }
    .btn:hover .btn-icon {
      transform: rotate(90deg);
    }

    .section {
      padding: 100px 7% 120px;
      background: #f9fafb;
      border-radius: 40px 40px 0 0;
      box-shadow: none;
      max-width: 1500px;
      margin: 0 auto;
      animation: fadeUp 1.1s ease both;
      position: relative;
    }
    .section-title {
      font-size: 32px;
      font-weight: 800;
      color: #111827;
      text-align: center;
      margin-bottom: 80px;
      position: relative;
    }
    .section-title::after {
      content: '';
      width: 60px;
      height: 4px;
      background: #7c3aed;
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .card-group {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }
    .card {
      flex: 1;
      min-width: 280px;
      padding: 50px 44px;
      border-radius: 28px;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.05);
      transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
      opacity: 0;
      transform: translateY(60px);
      animation: cardFadeUp 0.9s ease forwards;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: #7c3aed;
      transform: scaleX(0);
      transition: 0.6s;
      transform-origin: left;
    }
    .card:hover::before {
      transform: scaleX(1);
    }
    .card:nth-child(1) { animation-delay: 0.15s; }
    .card:nth-child(2) { animation-delay: 0.35s; }
    .card:nth-child(3) { animation-delay: 0.55s; }

    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border-color: rgba(124, 58, 237, 0.12);
    }
    .card-icon {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 32px;
      margin-bottom: 28px;
      transition: 0.5s;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .card:hover .card-icon {
      transform: scale(1.1);
    }
    .card-title {
      font-size: 24px;
      font-weight: 750;
      color: #111827;
      margin-bottom: 16px;
    }
    .card-desc {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      transition: 0.4s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      text-decoration: none;
    }
    .card:hover .card-btn {
      padding-left: 32px;
      padding-right: 32px;
      gap: 12px;
    }

    .card1 .card-icon { background: #7c3aed; }
    .card1 .card-btn { background: #7c3aed; }
    .card2 .card-icon { background: #059669; }
    .card2 .card-btn { background: #059669; }
    .card3 .card-icon { background: #f97316; }
    .card3 .card-btn { background: #f97316; }

    .footer {
      background: #111827;
      padding: 50px 7%;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    .footer a {
      color: #9ca3af;
      font-size: 14px;
      text-decoration: none;
      transition: 0.3s;
      position: relative;
    }
    .footer a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: 0.3s;
    }
    .footer a:hover {
      color: #fff;
    }
    .footer a:hover::after {
      width: 100%;
    }
    .footer-line {
      height: 8px;
      background: linear-gradient(90deg, #7c3aed, #ec4899, #fb923c, #ffd166);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(60px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(70px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 209, 102, 0.35); }
      50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(255, 209, 102, 0.45); }
      100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 209, 102, 0.35); }
    }
    @keyframes titleSlide {
      from { opacity:0; transform: translateY(30px); }
      to { opacity:1; transform: translateY(0); }
    }

    /* 教育资讯 - 刷新按钮 */
    .edu-refresh {
      font-size: 18px;
      color: #7c3aed;
      cursor: pointer;
      transition: transform 0.4s ease;
      display: inline-block;
      margin-left: 4px;
    }
    .edu-refresh:hover {
      transform: rotate(30deg);
      color: #5b21b6;
    }
    .edu-refresh.spinning {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 教育资讯 - 加载动画 */
    .edu-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 20px 0;
    }
    .edu-loading-dot {
      width: 8px;
      height: 8px;
      background: #7c3aed;
      border-radius: 50%;
      animation: loadingBounce 1.2s ease-in-out infinite;
    }
    .edu-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .edu-loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loadingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 教育资讯 - 空状态 */
    .edu-empty {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding: 20px 0;
    }

    /* 教育资讯 - 文章条目 */
    .edu-news-item {
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
    }
    .edu-news-item:last-child {
      border-bottom: none;
    }
    .edu-news-item:hover {
      padding-left: 8px;
      background: rgba(124, 58, 237, 0.03);
      border-radius: 8px;
    }
    .edu-news-item:hover .edu-news-title {
      color: #7c3aed;
    }
    .edu-news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .edu-news-source {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: #7c3aed;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }
    .edu-news-source.moe {
      background: #dc2626;
    }
    .edu-news-source.eol {
      background: #2563eb;
    }
    .edu-news-source.people {
      background: #d97706;
    }
    .edu-news-time {
      font-size: 11px;
      color: #9ca3af;
    }
    .edu-news-title {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      line-height: 1.5;
      margin-bottom: 4px;
      transition: color 0.3s ease;
    }
    .edu-news-url {
      font-size: 12px;
      color: #7c3aed;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .edu-news-item:hover .edu-news-url {
      opacity: 0.7;
    }

    /* 教育资讯 - 错误提示 */
    .edu-error {
      text-align: center;
      color: #ef4444;
      font-size: 13px;
      padding: 16px 0;
    }
    .edu-retry {
      color: #7c3aed;
      cursor: pointer;
      font-weight: 600;
      margin-left: 6px;
      transition: color 0.3s;
    }
    .edu-retry:hover {
      color: #5b21b6;
    }

    /* 教育资讯 - 分页 */
    .edu-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 8px;
    }
    .edu-page-btn {
      background: #ffffff;
      border: 1.5px solid #7c3aed;
      color: #7c3aed;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .edu-page-btn:hover:not(:disabled) {
      background: #7c3aed;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }
    .edu-page-btn:disabled {
      border-color: #d1d5db;
      color: #d1d5db;
      cursor: not-allowed;
      background: #f9fafb;
    }
    .edu-page-info {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
      min-width: 70px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="header">
  <div class="logo">数据洞察 <span>平台</span></div>
  <div class="nav">
    <a href="vue-charts.html" class="nav-item">可视化分析</a>
    <a href="data-self.html" class="nav-item">自助数据</a>

</div>

<div class="news-bar"></div>

<div class="hero">
  <div class="hero-text">
    <div class="hero-title">阅读素养视域下的</div>
    <div class="hero-gradient">教育决策多元动态</div>
    <div class="hero-gradient-last">
      洞察系统
      <div class="hero-dot"></div>
    </div>

      <div class="btn-icon"></div>
      开始使用
    </a>

  <div class="edu-info">
    <div class="edu-title">教育资讯

      <button id="edu-prev" class="edu-page-btn" disabled>&#8592; 上一页</button>
      <span id="edu-page-info" class="edu-page-info"></span>
      <button id="edu-next" class="edu-page-btn">下一页 &#8594;</button>
    </div>
  </div>
</div>

  <div class="section-title">核心功能入口</div>
  <div class="card-group">
    <div class="card card1">
      <div class="card-icon">📊</div>
      <div class="card-title">可视化分析</div>
      <div class="card-desc">实时可视化展示教育数据，多维度动态分析</div>

</body>
<script>
  // 配置
  const CRAWLER_API = '/api';
  const PAGE_SIZE = 3; // 必须与后端一致

  // DOM 元素
  const eduList = document.getElementById('edu-list');
  const eduLoading = document.getElementById('edu-loading');
  const eduEmpty = document.getElementById('edu-empty');
  const eduPagination = document.getElementById('edu-pagination');
  const refreshBtn = document.getElementById('refreshBtn');
  const prevBtn = document.getElementById('edu-prev');
  const nextBtn = document.getElementById('edu-next');
  const pageInfo = document.getElementById('edu-page-info');

  let currentPage = 1;
  let totalPages = 1;
  let totalCount = 0;
  let refreshTimer = null;

  // 获取来源标签样式
  function getSourceClass(source) {
    const map = {
      '中国教育在线': 'eol',
      '教育部官网': 'moe',
      '人民网教育': 'people'
    };
    return map[source] || '';
  }

  // 渲染当前页新闻
  function renderNews(news) {
    if (!news || news.length === 0) {
      eduList.innerHTML = '<div class="edu-empty">暂无资讯</div>';
      eduEmpty.style.display = 'none';
      return;
    }

    eduEmpty.style.display = 'none';
    eduList.innerHTML = news.map(item => `
      <a href="${item.url || '#'}" class="edu-news-item" target="_blank" rel="noopener">
        <div class="edu-news-meta">
          <span class="edu-news-source ${getSourceClass(item.source)}">${item.source}</span>
          <span class="edu-news-time">${item.crawl_time || ''}</span>
        </div>
        <div class="edu-news-title">${item.title}</div>
      </a>
    `).join('');
  }

  // 更新分页控件状态
  function updatePagination(page, totalPage, total) {
    if (total === 0) {
      eduPagination.style.display = 'none';
      return;
    }
    eduPagination.style.display = 'flex';
    prevBtn.disabled = page <= 1;
    nextBtn.disabled = page >= totalPage;
    pageInfo.textContent = `${page} / ${totalPage}`;
  }

  // 显示加载状态
  function showLoading() {
    eduList.innerHTML = '';
    eduLoading.style.display = 'flex';
    eduEmpty.style.display = 'none';
    eduPagination.style.display = 'none';
  }

  // 显示错误状态
  function showError(msg) {
    eduLoading.style.display = 'none';
    eduEmpty.style.display = 'none';
    eduPagination.style.display = 'none';
    eduList.innerHTML = `<div class="edu-error">${msg} <span class="edu-retry" onclick="goToPage(1)">重新加载</span></div>`;
  }

  // 加载指定页
  async function goToPage(page) {
    showLoading();

    try {
      const res = await fetch(`${CRAWLER_API}/news?page=${page}&_=${Date.now()}`, {
        cache: 'no-cache'
      });
      if (!res.ok) throw new Error('获取数据失败');

      const result = await res.json();
      currentPage = result.page;
      totalPages = result.total_pages;
      totalCount = result.total;

      renderNews(result.data);
      updatePagination(currentPage, totalPages, totalCount);

    } catch (err) {
      const isOffline = err.message.includes('Failed to fetch') || err.message.includes('网络') || err.message.includes('服务');
      if (isOffline) {
        eduLoading.style.display = 'none';
        eduEmpty.style.display = 'none';
        eduPagination.style.display = 'none';
        eduList.innerHTML = `
          <div class="edu-error" style="color:#6b7280;font-size:13px;">
            资讯服务离线
            <span class="edu-retry" style="color:#7c3aed" onclick="goToPage(1)">重试</span>
          </div>`;
      } else {
        showError(err.message);
      }
    }
  }

  // 刷新：保持当前页，如果总条数增加则往后滚动
  async function refreshCurrentPage() {
    try {
      const res = await fetch(`${CRAWLER_API}/news?page=${currentPage}&_=${Date.now()}`, {
        cache: 'no-cache'
      });
      if (!res.ok) return;

      const result = await res.json();
      totalCount = result.total;
      totalPages = result.total_pages;

      // 如果当前页超出新范围，回到最后一页
      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      renderNews(result.data);
      updatePagination(currentPage, totalPages, totalCount);

    } catch (e) {
      // 静默失败，不影响用户
    }
  }

  // 手动刷新
  function manualRefresh() {
    if (refreshBtn.classList.contains('spinning')) return;
    refreshBtn.classList.add('spinning');
    goToPage(1).finally(() => {
      setTimeout(() => refreshBtn.classList.remove('spinning'), 800);
    });
  }

  // 上一页
  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) goToPage(currentPage - 1);
  });

  // 下一页
  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) goToPage(currentPage + 1);
  });

  // 事件绑定
  refreshBtn.addEventListener('click', manualRefresh);

  // 初始化：启动爬虫
  async function initCrawler() {
    try {
      await fetch(`${CRAWLER_API}/start`, { method: 'POST' });
    } catch (e) {
      // 忽略启动错误
    }
  }

  // 页面加载完成后初始化
  document.addEventListener('DOMContentLoaded', () => {
    goToPage(1);
    initCrawler();

    // 每15秒刷新当前页
    refreshTimer = setInterval(refreshCurrentPage, 15000);
  });

  // 页面离开时停止刷新
  window.addEventListener('beforeunload', () => {
    if (refreshTimer) clearInterval(refreshTimer);
  });
</script>
</html>
